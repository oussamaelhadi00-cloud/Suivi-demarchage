<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi démarchage — Attijariwafa bank</title>
<style>
:root{
  --orange:#f07f1a; --orange-deep:#d9690b; --orange-soft:#fff1e4; --gold:#f5b335;
  --anth:#2a2a2d; --anth-2:#3a3a40; --ink:#1d1d20; --muted:#6f6f78; --line:#e4e2dd; --line-2:#cfcdc6;
  --bg:#f4f3f0; --panel:#ffffff;
  --ok:#1f7a4d; --ok-soft:#e4f3ea; --info:#2d5c9e; --info-soft:#e6eef9; --danger:#c0392b; --danger-soft:#fbe7e4;
  --r:6px;
  font-size:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Bahnschrift","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}

/* ---- bandeau ---- */
header{display:flex;align-items:center;gap:18px;padding:0 20px;height:58px;background:var(--anth);color:#fff;border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .wm{font-size:17px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand .wm span{color:var(--orange)}
.brand .sep{width:1px;height:28px;background:#55555c}
.brand .app-name{font-size:13px;color:#c8c8cc;white-space:nowrap}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;height:34px;padding:0 12px 0 34px;border:1px solid #4a4a50;border-radius:var(--r);background:#1f1f22;color:#fff;outline:none}
.search input::placeholder{color:#8e8e95}
.search input:focus{border-color:var(--orange)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:#8e8e95}
.hbtns{display:flex;gap:6px;margin-left:auto;flex-wrap:nowrap}
.btn{border:1px solid var(--line-2);background:var(--panel);padding:0 11px;height:32px;border-radius:var(--r);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f6f5f2}
header .btn{background:transparent;color:#fff;border-color:#55555c}
header .btn:hover{background:#3a3a40}
.btn.primary,header .btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.primary:hover,header .btn.primary:hover{background:var(--orange-deep)}
.btn.danger{color:var(--danger)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}

/* ---- ruban chiffres ---- */
.kpis{display:flex;gap:0;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.kpi{padding:10px 18px 9px 0;margin-right:18px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.kpi:last-child{border-right:none}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.alert .v{color:var(--orange-deep)}
.kpi.alert .l{color:var(--orange-deep);font-weight:600}
.kpi:hover .l{color:var(--ink)}

/* ---- corps ---- */
main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;padding:14px 20px 16px;min-height:0}
.side{display:flex;flex-direction:column;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0}
.card h2{font-size:15px;margin:0;padding:12px 14px 10px;font-weight:600;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;font-size:12px;font-weight:600;background:var(--orange);color:#fff}
.badge.zero{background:var(--ok)}
.relances{overflow:auto;flex:1}
.rel{display:grid;grid-template-columns:56px 1fr;gap:0 10px;padding:10px 12px 10px 10px;cursor:pointer;border-bottom:1px solid #f0efeb;align-items:start}
.rel:hover{background:var(--orange-soft)}
.rel .bar{display:none}
.rel .d{font-size:20px;font-weight:600;color:var(--orange-deep);line-height:1.05;letter-spacing:-.02em}
.rel .d small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.rel.soft .d{color:var(--info)}
.rel .t{font-weight:600;font-size:13px}
.rel .s{font-size:12px;color:var(--muted);margin-top:1px}
.empty{padding:22px 14px;color:var(--muted);font-size:13px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.filters select{height:30px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;font-size:12.5px;max-width:170px}
.filters .spacer{flex:1}
.filters .count{font-size:12px;color:var(--muted)}
.tablewrap{overflow:auto;flex:1}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;background:#fafaf8;text-align:left;padding:9px 10px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid var(--line-2);white-space:nowrap;cursor:pointer;user-select:none}
thead th.sorted{color:var(--orange-deep)}
tbody td{padding:7px 10px;border-bottom:1px solid #f0efeb;vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#faf8f4}
tbody tr.sel td{background:var(--orange-soft)}
td.name{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}
td.name small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
td.wrap{white-space:normal;max-width:240px;font-size:12.5px;color:#44444a}
.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11.5px;font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.yes{color:var(--ok);font-weight:700}.no{color:#b7b7bd}
.prio{display:inline-block;min-width:22px;text-align:center;border-radius:3px;padding:1px 6px;font-weight:600;font-size:12px}
.p-1,.p0{background:var(--ok-soft);color:var(--ok)}.p1{background:var(--orange-soft);color:var(--orange-deep)}.p2{background:#fff7e0;color:#9a6b00}.p3,.p4,.p5{background:#efeeeb;color:var(--muted)}
.alertcell{font-size:12px;color:var(--orange-deep);font-weight:600}
.alertcell.soft{color:var(--info)}

/* ---- fiche ---- */
.overlay{position:fixed;inset:0;background:rgba(30,30,33,.45);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(740px,100%);background:var(--panel);box-shadow:-12px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:.25s cubic-bezier(.2,.8,.2,1);z-index:30;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dhead{padding:16px 22px 14px;background:var(--anth);color:#fff;border-bottom:3px solid var(--orange);display:flex;align-items:flex-start;gap:12px}
.dhead h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.dhead .sub{color:#c8c8cc;font-size:12.5px;margin-top:3px}
.dhead .x{margin-left:auto;border:none;background:transparent;font-size:24px;line-height:1;color:#c8c8cc;padding:2px 6px}
.dhead .x:hover{color:#fff}
.dbody{overflow:auto;flex:1;padding:16px 22px 40px}
.quick{background:var(--orange-soft);border:1px solid #f6cfa6;border-radius:var(--r);padding:14px}
.quick h4{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--orange-deep)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid #f0c494;background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px}
.chip:hover{border-color:var(--orange)}
.chip.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.quick .row{display:flex;gap:8px;align-items:flex-start}
.quick textarea{flex:1;min-height:60px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r);resize:vertical;background:#fff}
.quick input[type=date]{height:36px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff}
.quick .btn.primary{height:36px}
.quick .hint{font-size:12px;color:#7a5a3a;margin-top:8px;min-height:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:18px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;height:34px;padding:0 9px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff}
.field textarea{height:auto;min-height:72px;padding:8px 9px;resize:vertical}
.field.full{grid-column:1/-1}
.section{margin-top:22px}
.section h4{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.timeline{border-left:2px solid var(--line-2);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:10px}
.ev{position:relative}
.ev:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line-2)}
.ev.msg:before{border-color:var(--info)}.ev.reponse:before,.ev.call_fait:before{border-color:var(--ok)}.ev.operation:before{border-color:var(--orange);background:var(--orange)}.ev.sollicitation:before{border-color:var(--gold);background:var(--gold)}.ev.relance:before{border-color:var(--danger)}
.ev .d{font-size:11.5px;color:var(--muted)}
.ev .d b{color:var(--ink);font-weight:600;margin-right:6px}
.ev .t{font-size:13px;margin-top:1px;white-space:pre-wrap}
.ev .del{opacity:0;border:none;background:none;color:var(--danger);font-size:11px;margin-left:6px}
.ev:hover .del{opacity:1}
.alertbox{border-radius:var(--r);padding:10px 12px;font-size:13px;margin-top:14px;display:flex;gap:10px;align-items:center;border-left:4px solid}
.alertbox.late{background:var(--orange-soft);color:#8a4a0c;border-color:var(--orange)}
.alertbox.soft{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.alertbox.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.alertbox .btn{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin-top:10px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--anth);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;opacity:0;transition:.2s;z-index:50;pointer-events:none;border-left:4px solid var(--orange)}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,30,33,.5);z-index:40}
.modal.open{display:flex}
.modal .box{background:var(--panel);border-radius:var(--r);padding:20px 22px;width:min(540px,94vw);border-top:4px solid var(--orange)}
.modal h3{margin:0 0 12px;font-size:17px;font-weight:600}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
/* ---- pipeline ---- */
.kanban{display:flex;gap:10px;overflow:auto;padding:12px;flex:1}
.col{min-width:236px;width:236px;background:var(--bg);border-radius:var(--r);display:flex;flex-direction:column;max-height:100%;border-top:3px solid var(--line-2)}
.col h5{margin:0;padding:10px 12px 6px;font-size:12.5px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between}
.col .cards{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;font-size:12.5px}
.kcard:hover{border-color:var(--orange)}
.kcard b{display:block;font-size:13px}
.kcard .m{color:var(--muted);font-size:11.5px;margin-top:2px}
.kcard .al{color:var(--orange-deep);font-size:11.5px;font-weight:600;margin-top:3px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.drawer,.overlay,.toast{transition:none}}
@media (max-width:980px){main{grid-template-columns:1fr}.side{max-height:300px}.brand .app-name,.brand .sep{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><img id="logo" alt="" class="hidden"><div class="wm" id="wm">Attijariwafa <span>bank</span></div><div class="sep"></div><div class="app-name">Suivi démarchage contreparties</div></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

  <div class="hbtns">

    <button class="btn primary" id="addBank">+ Banque</button>
    <button class="btn" id="exportJson" title="Sauvegarde complète (à faire régulièrement)">Sauvegarder</button>
    <button class="btn" id="importJson">Restaurer</button>
    <button class="btn" id="exportCsv">Export Excel</button>
    <button class="btn" id="settings">⚙</button>

</header>
<div class="kpis" id="kpis"></div>
<main>

      <div class="relances" id="relances"></div>
    </div>
  </aside>
  <section class="card" id="mainCard">
    <div class="filters" id="filters"></div>
    <div class="tablewrap" id="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="kanban hidden" id="kanban"></div>
  </section>
</main>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"></div>
<input type="file" id="fileInput" accept="application/json" class="hidden">

    if(raw){ const s = JSON.parse(raw); if(s && s.banks){ s.settings = Object.assign({days:7, days2:14, notif:true, lastNotif:null}, s.settings||{}); return s; } }
  }catch(e){ console.warn('localStorage indisponible', e); }
  return { banks: JSON.parse(JSON.stringify(SEED)), settings:{days:7, days2:14, notif:true, lastNotif:null}, seedVersion:SEED_VERSION, view:'table' };
}

const $ = s=>document.querySelector(s);
const todayISO = ()=> new Date().toISOString().slice(0,10);
const fmt = d => d ? new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—';
const daysSince = d => d ? Math.floor((new Date(todayISO()) - new Date(d))/86400000) : null;
const addDays = (d,n)=>{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
const uid = ()=> 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ======================= RELANCES ======================= */
function lastActivity(b){
  const ds = (b.journal||[]).map(e=>e.date).filter(Boolean);
  if(b.derniereActivite) ds.push(b.derniereActivite);
  return ds.length ? ds.sort().at(-1) : null;
}
function alerts(b){
  const N = state.settings.days, N2 = state.settings.days2, out=[];
  const t = todayISO();
  if(b.statut==='standby') return out;
  if(b.snoozeJusqu && b.snoozeJusqu > t) return out;
  if(b.callPrevu && b.callPrevu <= t){
    const d = daysSince(b.callPrevu);
    out.push({k:'call', late:d>0, soft:d===0, msg: d===0?'Call aujourd\'hui → marquer effectué':`Call prévu le ${fmt(b.callPrevu)} — à marquer effectué ou replanifier`, days:d});
  }
  if(b.attenteReponseDepuis){
    const d = daysSince(b.attenteReponseDepuis);
    if(d>=N) out.push({k:'relance', late:true, msg:`Relancer — message du ${fmt(b.attenteReponseDepuis)} sans réponse (${d} j)`, days:d-N});
  }
  if(b.statut==='call_a_planifier'){
    const d = daysSince(lastActivity(b)||t);
    if(d>=3) out.push({k:'planif', late:true, msg:`La banque a demandé un call il y a ${d} j — à planifier`, days:d});
  }
  if(b.statut==='premier_deal'){
    const d = daysSince(lastActivity(b)||t);
    if(d>=N) out.push({k:'deal1', late:true, msg:`1er deal toujours pas traité (${d} j) — relancer`, days:d-N});
  }
  if(b.statut==='actif' && b.derniereOperation){
    const d = daysSince(b.derniereOperation);
    if(d>=N) out.push({k:'redemande', late:d>=N2, soft:d<N2, msg:`Redemander une opération — dernière le ${fmt(b.derniereOperation)} (${d} j)`, days:d-N});
  }
  if(b.echeance && b.echeance<=t && b.prochaineAction){
    out.push({k:'action', late:true, msg:`${b.prochaineAction} (échéance ${fmt(b.echeance)})`, days:daysSince(b.echeance)});
  }
  if(!out.length && ['en_discussion','kyc_limite'].includes(b.statut)){
    const la = lastActivity(b); const d = daysSince(la);
    if(la && d>=N2) out.push({k:'silence', soft:true, msg:`Sans nouvelles depuis ${d} j — prendre des nouvelles`, days:d-N2});
  }
  return out;
}

function filtered(){
  const q = $('#q').value.trim().toLowerCase();
  return state.banks.filter(b=>{
    const al = alerts(b);
    if(filters.alert==='due' && !al.some(a=>!a.soft)) return false;
    if(filters.alert==='soft' && !(al.length && !al.some(a=>!a.soft))) return false;
    if(filters.alert==='none' && al.length) return false;
    if(filters.alert==='encours' && !['attente_reponse','en_discussion','call_a_planifier','call_planifie','kyc_limite','premier_deal'].includes(b.statut)) return false;
    if(filters.statut && b.statut!==filters.statut) return false;
    if(filters.segment && b.segment!==filters.segment) return false;
    if(filters.pays && b.pays!==filters.pays) return false;
    if(filters.respoFI && b.respoFI!==filters.respoFI) return false;
    if(filters.rma && b.rma!==filters.rma) return false;
    if(filters.relationFI && String(+!!b.relationFI)!==filters.relationFI) return false;
    if(filters.callFait && String(+!!b.callFait)!==filters.callFait) return false;
    if(filters.appetit && b.appetit!==filters.appetit) return false;
    if(q){ const hay = [b.nom,b.pays,b.groupe,b.respoFI,b.contact,b.notes,b.prochaineAction,(b.journal||[]).map(e=>e.text).join(' ')].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

const COLS = [
  {k:'nom',l:'Contrepartie'},{k:'pays',l:'Pays'},{k:'respoFI',l:'Respo FI'},{k:'statut',l:'Statut'},
  {k:'rma',l:'Clé RMA'},{k:'relationFI',l:'FI'},{k:'callFait',l:'Call'},{k:'appetit',l:'Appétit'},{k:'priorite',l:'Prio'},
  {k:'last',l:'Dern. activité'},{k:'next',l:'Prochaine action'},{k:'alert',l:'Alerte'}
];
function sortVal(b,k){
  if(k==='last') return lastActivity(b)||'';
  if(k==='alert'){ const a=alerts(b); return a.length? (a.some(x=>!x.soft)?2000:1000)+Math.max(...a.map(x=>x.days)) : 0; }
  if(k==='statut') return STATUTS[b.statut]?.order??99;
  if(k==='next') return b.prochaineAction||'';
  if(k==='priorite') return b.priorite??99;
  return b[k]??'';
}
function renderTable(){
  const rows = filtered().sort((x,y)=>{ const a=sortVal(x,sort.col), b=sortVal(y,sort.col); return (a>b?1:a<b?-1:0)*sort.dir || x.nom.localeCompare(y.nom); });
  $('#count').textContent = `${rows.length} / ${state.banks.length}`;
  $('#thead').innerHTML = '<tr>'+COLS.map(c=>`<th data-k="${c.k}" class="${sort.col===c.k?'sorted':''}">${c.l} ${sort.col===c.k?(sort.dir>0?'↑':'↓'):''}</th>`).join('')+'</tr>';

      <td>${b.relationFI?'<span class="yes">✔</span>':'<span class="no">—</span>'}</td>

function addEvent(b, type, date, text){
  if(!text && !['call_fait','reponse','rma_ok','fi','relance'].includes(type)) { toast('Écrivez un mot sur ce qui s\'est passé'); return; }
  b.journal = b.journal||[];
  b.journal.push({date, type, text: text || EVENTS[type].l});
  b.snoozeJusqu = null;
  const isClient = b.statut==='actif';
  switch(type){
    case 'msg': b.attenteReponseDepuis = date; if(!isClient) b.statut = ['non_contacte','contact_a_trouver','a_demarcher','attente_reponse'].includes(b.statut)?'attente_reponse':b.statut; break;
    case 'relance': b.attenteReponseDepuis = date; break;
    case 'reponse': b.attenteReponseDepuis = null; if(['attente_reponse','a_demarcher','non_contacte','contact_a_trouver'].includes(b.statut)) b.statut='en_discussion'; break;
    case 'sollicitation': b.attenteReponseDepuis = null; if(!isClient) b.statut='premier_deal'; b.prochaineAction = b.prochaineAction||'Traiter la 1ère opération'; break;
    case 'call_demande': b.attenteReponseDepuis = null; b.statut='call_a_planifier'; break;
    case 'call_planifie': b.callPrevu = date; b.attenteReponseDepuis=null; if(!isClient) b.statut='call_planifie'; break;
    case 'call_fait': b.callFait = true; b.callPrevu = null; b.attenteReponseDepuis=null; if(['call_planifie','call_a_planifier','attente_reponse','a_demarcher','non_contacte','contact_a_trouver'].includes(b.statut)) b.statut='en_discussion'; break;
    case 'operation': b.derniereOperation = date; b.attenteReponseDepuis=null; b.statut='actif'; if(b.prochaineAction==='Traiter la 1ère opération') {b.prochaineAction=''; b.echeance=null;} break;
    case 'kyc': if(!isClient) b.statut='kyc_limite'; break;
    case 'rma_ok': b.rma='dispo'; break;
    case 'fi': b.relationFI=true; break;
    case 'standby': b.statut='standby'; b.attenteReponseDepuis=null; break;
  }
  b.derniereActivite = date;
  save(); renderAll(); openBank(b.id); toast('Mise à jour enregistrée');
}

/* ======================= AJOUT / MODALES ======================= */
function confirmBox(msg, onOk){
  $('#modal').innerHTML = `<div class="box"><h3>Confirmation</h3><p>${msg}</p><div class="actions"><button class="btn" id="mNo">Annuler</button><button class="btn primary" id="mOk">Confirmer</button></div></div>`;
  $('#modal').classList.add('open'); $('#mNo').onclick=()=>$('#modal').classList.remove('open'); $('#mOk').onclick=()=>{ $('#modal').classList.remove('open'); onOk(); };
}
$('#addBank').onclick=()=>{
  $('#modal').innerHTML = `<div class="box"><h3>Nouvelle contrepartie</h3>
    <div class="grid2" style="margin-top:0">
      <div class="field full"><label>Nom</label><input id="nNom" autofocus></div>
      <div class="field"><label>Pays</label><input id="nPays"></div>
      <div class="field"><label>Groupe / stratégie</label><input id="nGroupe" placeholder="GROUPES AFRICAINS, INDEPENDANTES…"></div>
      <div class="field"><label>Respo FI</label><input id="nFI"></div>
      <div class="field"><label>Clé RMA</label><select id="nRma"><option value="inconnu">Inconnu</option><option value="dispo">Disponible</option><option value="indispo">Non disponible</option></select></div>
      <div class="field full"><label>Contact</label><input id="nContact"></div>
    </div><div class="actions"><button class="btn" id="mNo">Annuler</button><button class="btn primary" id="mOk">Créer</button></div></div>`;
  $('#modal').classList.add('open'); $('#mNo').onclick=()=>$('#modal').classList.remove('open');
  $('#mOk').onclick=()=>{ const nom=$('#nNom').value.trim(); if(!nom) return;
    const b={id:uid(),nom,pays:$('#nPays').value.trim().toUpperCase(),groupe:$('#nGroupe').value.trim().toUpperCase(),respoFI:$('#nFI').value.trim().toUpperCase(),type:'HG',relationFI:false,callFait:false,appetit:'A VOIR',rma:$('#nRma').value,priorite:null,segment:'prospect',statut:'non_contacte',contact:$('#nContact').value.trim(),notes:'',journal:[],derniereActivite:null,prochaineAction:'',echeance:null,attenteReponseDepuis:null,derniereOperation:null};
    state.banks.push(b); save(); $('#modal').classList.remove('open'); renderAll(); openBank(b.id); };
};
$('#settings').onclick=()=>{
  const s=state.settings;
  $('#modal').innerHTML = `<div class="box"><h3>Réglages</h3>
    <div class="grid2" style="margin-top:0">
      <div class="field"><label>Relance après (jours)</label><input type="number" id="sDays" value="${s.days}" min="1"></div>
      <div class="field"><label>« Sans nouvelles » après (jours)</label><input type="number" id="sDays2" value="${s.days2}" min="1"></div>
      <div class="field full"><label>Notifications navigateur</label><button class="btn" id="sNotif">${Notification?.permission==='granted'?'✔ Activées':'Activer les notifications'}</button>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Les rappels s'affichent quand cette page est ouverte dans un onglet (épinglez-la). Pour des rappels même PC éteint, il faut un serveur : voir le guide livré avec le fichier.</div></div>
      <div class="field full"><label>Logo (fichier officiel PNG/SVG, affiché dans le bandeau)</label>
        <div style="display:flex;gap:6px"><button class="btn sm" id="sLogo">Importer le logo</button><button class="btn sm" id="sLogoDel">Retirer</button></div></div>
      <div class="field full"><label>Données</label>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm danger" id="sReset">Réinitialiser depuis le fichier Excel d'origine</button></div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">Les données vivent dans ce navigateur (localStorage). Faites « Sauvegarder » régulièrement : le fichier JSON se restaure sur n'importe quel PC.</div></div>
    </div><div class="actions"><button class="btn primary" id="mOk">Fermer</button></div></div>`;
  $('#modal').classList.add('open');
  $('#mOk').onclick=()=>{ s.days=Math.max(1,+$('#sDays').value||7); s.days2=Math.max(1,+$('#sDays2').value||14); save(); $('#modal').classList.remove('open'); renderAll(); };
  $('#sNotif').onclick=async()=>{ try{ const p=await Notification.requestPermission(); $('#sNotif').textContent = p==='granted'?'✔ Activées':'Refusées par le navigateur'; if(p==='granted') notifyDue(true);}catch(e){ toast('Notifications non disponibles'); } };
  $('#sLogo').onclick=()=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=()=>{ const f=i.files[0]; if(!f) return; if(f.size>400000){ toast('Image trop lourde (max 400 Ko)'); return; } const r=new FileReader(); r.onload=()=>{ s.logo=r.result; save(); applyLogo(); toast('Logo ajouté'); }; r.readAsDataURL(f); }; i.click(); };
  $('#sLogoDel').onclick=()=>{ s.logo=null; save(); applyLogo(); };
  $('#sReset').onclick=()=>confirmBox('Toutes vos mises à jour seront perdues et remplacées par les données du fichier Excel. Continuer ?', ()=>{ state.banks=JSON.parse(JSON.stringify(SEED)); save(); renderAll(); closeDrawer(); toast('Données réinitialisées'); });
};

/* ======================= IMPORT / EXPORT ======================= */
function download(name, content, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
$('#exportJson').onclick=()=>{ download(`deskcrm-sauvegarde-${todayISO()}.json`, JSON.stringify(state,null,1), 'application/json'); toast('Sauvegarde téléchargée'); };
$('#importJson').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.banks) throw 0; confirmBox(`Restaurer ${s.banks.length} contreparties depuis « ${esc(f.name)} » ? Les données actuelles seront remplacées.`, ()=>{ state=s; state.settings=Object.assign({days:7,days2:14},s.settings||{}); save(); renderAll(); toast('Sauvegarde restaurée'); }); }catch(err){ toast('Fichier invalide'); } }; r.readAsText(f); e.target.value=''; };
$('#exportCsv').onclick=()=>{
  const cols=['nom','pays','groupe','respoFI','statut','rma','relationFI','callFait','appetit','priorite','derniereActivite','prochaineAction','echeance','attenteReponseDepuis','derniereOperation','limiteFx','limiteEtat','contact','notes','alerte','journal'];
  const head=['Contrepartie','Pays','Groupe','Respo FI','Statut','Clé RMA','Relation FI','Call','Appétit','Priorité','Dernière activité','Prochaine action','Échéance','Msg sans réponse depuis','Dernière opération','Limite FX (M€)','État limite','Contacts','Notes','Alerte','Journal'];
  const cell=v=>{ v=v==null?'':String(v); return '"'+v.replace(/"/g,'""')+'"'; };
  const lines=[head.join(';')].concat(filtered().map(b=>cols.map(k=>{
    if(k==='statut') return cell(STATUTS[b.statut]?.l||b.statut);
    if(k==='relationFI'||k==='callFait') return cell(b[k]?'OUI':'NON');
    if(k==='derniereActivite') return cell(lastActivity(b));
    if(k==='alerte') return cell(alerts(b).map(a=>a.msg).join(' | '));
    if(k==='journal') return cell((b.journal||[]).slice().sort((x,y)=>(x.date||'').localeCompare(y.date||'')).map(e=>(e.date?fmt(e.date)+' ':'')+e.text).join('\n'));
    return cell(b[k]);
  }).join(';')));
  download(`deskcrm-${todayISO()}.csv`, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8'); toast('Export Excel (CSV) téléchargé');
};
$('#viewToggle').onclick=()=>{ state.view = state.view==='kanban'?'table':'kanban'; applyView(); save(); };
function applyView(){ const k=state.view==='kanban'; $('#tablewrap').classList.toggle('hidden',k); $('#kanban').classList.toggle('hidden',!k); $('#viewToggle').textContent = k?'Vue tableau':'Vue pipeline'; }
$('#q').oninput=()=>renderTable();

/* ======================= NOTIFICATIONS ======================= */
function notifyDue(force){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const due = state.banks.filter(b=>alerts(b).some(a=>!a.soft));
  if(!due.length) return;
  if(!force && state.settings.lastNotif===todayISO()) return;
  state.settings.lastNotif = todayISO(); save();
  try{ new Notification(`${due.length} relance(s) à faire`, { body: due.slice(0,4).map(b=>'• '+b.nom+' — '+alerts(b)[0].msg).join('\n') + (due.length>4?`\n… et ${due.length-4} autres`:'') }); }catch(e){}
}
setInterval(()=>{ renderAll(); notifyDue(false); }, 30*60*1000);

function applyLogo(){ const l=state.settings.logo; $('#logo').classList.toggle('hidden',!l); $('#wm').classList.toggle('hidden',!!l); if(l) $('#logo').src=l; }
/* ======================= INIT ======================= */
applyLogo();
renderFilters(); applyView(); renderAll(); notifyDue(false);
</script>
</body>
</html>
